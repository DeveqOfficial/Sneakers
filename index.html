<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="resources/icon/image.png" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catálogo de Artículos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="bg-blobs">
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
</div>

<header onclick="window.location.hash=''" style="cursor:pointer">
  <div class="logo-badge">
    <span class="material-icons-round">storefront</span>
    Catálogo Oficial
  </div>
  <h1>Sneakers & Más</h1>
  <p class="subtitle">Encuentra los mejores artículos al mejor precio $</p>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="material-icons-round">search</span>
    <input id="searchInput" type="text" placeholder="Buscar artículo..." autocomplete="off"/>
  </div>
  <select class="sort-select" id="sortSelect">
    <option value="default">Orden original</option>
    <option value="asc">Precio: menor a mayor</option>
    <option value="desc">Precio: mayor a menor</option>
    <option value="name">Nombre A–Z</option>
    <option value="favs">Favoritos</option>
  </select>
</div>

<!-- VISTA CATÁLOGO -->
<div id="viewCatalog">
  <div class="grid-wrapper">
    <p class="count-label">Mostrando <span id="countNum">0</span> artículos</p>
    <div id="catalog"></div>
  </div>
</div>

<!-- VISTA PRODUCTO (SPA) -->
<div id="viewProduct" style="display:none">
  <div class="product-page">
    <button class="product-back" onclick="goBack()">
      <span class="material-icons-round">arrow_back</span>
      Volver al catálogo
    </button>
    <div class="product-layout">
      <div class="product-thumbs" id="productThumbs"></div>
      <div class="product-main-img-wrap">
        <img id="productMainImg" src="" alt="" onclick="openLightbox(currentImgs, currentThumb)"/>
        <button class="product-img-btn prev" onclick="thumbNav(-1)">
          <span class="material-icons-round">chevron_left</span>
        </button>
        <button class="product-img-btn next" onclick="thumbNav(1)">
          <span class="material-icons-round">chevron_right</span>
        </button>
      </div>
      <div class="product-info">
        <div class="product-badges" id="productBadges"></div>
        <h2 class="product-name" id="productName"></h2>
        <div class="product-price" id="productPrice"></div>
        <div class="product-sizes-wrap" id="productSizesWrap">
          <p class="product-sizes-label">Selecciona tu talla (MX):</p>
          <div class="product-sizes" id="productSizes"></div>
        </div>
        <div class="product-desc" id="productDesc"></div>
        <div class="product-actions">
          <button class="product-fav-btn fav-btn" id="productFavBtn" onclick="toggleFavProduct()">
            <span class="material-icons-round">favorite_border</span>
          </button>
          <a class="product-wa-btn" id="productWaBtn" target="_blank">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
              <path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.556 4.112 1.528 5.836L.057 23.571a.75.75 0 00.92.92l5.735-1.471A11.943 11.943 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.725 9.725 0 01-4.989-1.374l-.358-.214-3.712.952.969-3.614-.234-.373A9.718 9.718 0 012.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/>
            </svg>
            Pedir por WhatsApp
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  Todos los modelos están sujetos a cambios y disponibilidad.
</footer>

<script src="js/catálogo.js"></script>

<a id="waBtn" class="wa-btn" target="_blank" style="display:none">
  <svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
    <path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.556 4.112 1.528 5.836L.057 23.571a.75.75 0 00.92.92l5.735-1.471A11.943 11.943 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.725 9.725 0 01-4.989-1.374l-.358-.214-3.712.952.969-3.614-.234-.373A9.718 9.718 0 012.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/>
  </svg>
  Pedir por WhatsApp
</a>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">
    <span class="material-icons-round">close</span>
  </button>
  <button class="lightbox-btn prev" id="lbPrev" onclick="event.stopPropagation();lbSlide(-1)">
    <span class="material-icons-round">chevron_left</span>
  </button>
  <img id="lightboxImg" src="" alt="" onclick="event.stopPropagation()"/>
  <button class="lightbox-btn next" id="lbNext" onclick="event.stopPropagation();lbSlide(1)">
    <span class="material-icons-round">chevron_right</span>
  </button>
</div>
</body>
</html>
